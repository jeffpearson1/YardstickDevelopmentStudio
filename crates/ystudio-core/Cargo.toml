[package]
name = "ystudio-core"
description = "Headless engine for Yardstick Development Studio: workspaces, recipes, lint, harness and agent runners."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
dirs.workspace = true
anyhow.workspace = true
calamine = { version = "0.38.0", default-features = false }
csv = { version = "1.4.0", default-features = false }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["charset", "gzip", "native-tls"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
resvg = "0.49.0"
pelite = "0.10.0"
msi = "0.11.1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Named pipes and ShellExecuteEx "runas" for the elevated test worker.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
