[package]
name = "ystudio-core"
description = "Headless engine for Yardstick Development Studio: workspaces, recipes, lint, harness and agent runners."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
dirs.workspace = true
anyhow.workspace = true
calamine = { version = "0.38.0", default-features = false }
csv = { version = "1.4.0", default-features = false }
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["charset", "gzip", "native-tls"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
resvg = "0.49.0"
pelite = "0.10.0"
msi = "0.11.1"

[dev-dependencies]
tempfile = "3"
