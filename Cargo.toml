[workspace]
resolver = "3"
members = ["crates/ystudio-core", "crates/ystudio"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Yardstick contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
dirs = "7"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
